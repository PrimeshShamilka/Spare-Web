<title>Spare Feature Graphic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@700;800&display=swap">
<style>
  :root {
    --green: #3DCAA0;
    --green-dark: #2BAE87;
    --green-light: #E6F9F4;
    --white: #ffffff;
    --fg: #1A2E28;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--white);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .graphic {
    width: 1024px;
    height: 500px;
    background: linear-gradient(135deg, #2BAE87 0%, #3DCAA0 50%, #5FD9B5 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 0 72px;
    gap: 64px;
  }

  /* Decorative circles */
  .graphic::before {
    content: '';
    position: absolute;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    border: 60px solid rgba(255,255,255,0.08);
    right: -120px;
    top: -120px;
  }
  .graphic::after {
    content: '';
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    border: 40px solid rgba(255,255,255,0.06);
    right: 160px;
    bottom: -140px;
  }

  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    z-index: 1;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-icon {
    width: 56px;
    height: 56px;
    background: rgba(255,255,255,0.2);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg {
    width: 32px;
    height: 32px;
  }

  .app-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 36px;
    font-weight: 800;
    color: white;
    letter-spacing: -0.5px;
  }

  .tagline {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 44px;
    font-weight: 700;
    color: white;
    line-height: 1.1;
    text-wrap: balance;
    max-width: 420px;
  }

  .tagline em {
    font-style: normal;
    color: rgba(255,255,255,0.75);
  }

  .pills {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .pill {
    background: rgba(255,255,255,0.18);
    border-radius: 100px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 600;
    color: white;
    letter-spacing: 0.01em;
  }

  /* Phone mockup on the right */
  .right {
    position: relative;
    z-index: 1;
    flex-shrink: 0;
  }

  .phone {
    width: 196px;
    height: 388px;
    background: white;
    border-radius: 32px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.25), 0 4px 16px rgba(0,0,0,0.1);
    overflow: hidden;
    position: relative;
    transform: rotate(3deg);
  }

  /* Phone screen content */
  .phone-screen {
    width: 100%;
    height: 100%;
    background: #F0F4F3;
    padding: 20px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .phone-header {
    font-size: 11px;
    font-weight: 700;
    color: #1A2E28;
    text-align: center;
    padding-bottom: 4px;
  }

  .wallet-card {
    background: linear-gradient(135deg, #2BAE87, #3DCAA0);
    border-radius: 16px;
    padding: 14px;
    color: white;
  }

  .wallet-label {
    font-size: 8px;
    font-weight: 600;
    opacity: 0.85;
    margin-bottom: 2px;
  }

  .wallet-amount {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 10px;
  }

  .wallet-row {
    display: flex;
    justify-content: space-between;
  }

  .wallet-stat { }
  .wallet-stat .label { font-size: 7px; opacity: 0.75; }
  .wallet-stat .val { font-size: 11px; font-weight: 700; }

  .activity-label {
    font-size: 10px;
    font-weight: 700;
    color: #1A2E28;
  }

  .tx-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .tx-row {
    background: white;
    border-radius: 10px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tx-icon {
    width: 24px;
    height: 24px;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .tx-name {
    font-size: 9px;
    font-weight: 600;
    color: #1A2E28;
    flex: 1;
  }

  .tx-amount {
    font-size: 9px;
    font-weight: 700;
  }

  .tx-neg { color: #E55353; }
  .tx-pos { color: #3DCAA0; }
</style>

<div class="graphic">
  <div class="left">
    <div class="logo-row">
      <div class="logo-icon">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="8" width="28" height="20" rx="4" stroke="white" stroke-width="2.5"/>
          <path d="M2 14h28" stroke="white" stroke-width="2.5"/>
          <circle cx="22" cy="20" r="2.5" fill="white"/>
          <path d="M6 11V8a4 4 0 014-4h12a4 4 0 014 4v3" stroke="white" stroke-width="2.5"/>
        </svg>
      </div>
      <span class="app-name">Spare</span>
    </div>
    <div class="tagline">Track spend.<br><em>Keep more.</em></div>
    <div class="pills">
      <div class="pill">Budget tracking</div>
      <div class="pill">Expense history</div>
      <div class="pill">Spending insights</div>
    </div>
  </div>

  <div class="right">
    <div class="phone">
      <div class="phone-screen">
        <div class="phone-header">Home</div>
        <div class="wallet-card">
          <div class="wallet-label">You're Saving</div>
          <div class="wallet-amount">$284.50</div>
          <div class="wallet-row">
            <div class="wallet-stat">
              <div class="label">Planned</div>
              <div class="val">$1,200</div>
            </div>
            <div class="wallet-stat">
              <div class="label">Expenses</div>
              <div class="val">$915.50</div>
            </div>
          </div>
        </div>
        <div class="activity-label">Recent Activity</div>
        <div class="tx-list">
          <div class="tx-row">
            <div class="tx-icon" style="background:#E8F5E9;"></div>
            <div class="tx-name">Groceries</div>
            <div class="tx-amount tx-neg">-$48.20</div>
          </div>
          <div class="tx-row">
            <div class="tx-icon" style="background:#FFF3E0;"></div>
            <div class="tx-name">Dining</div>
            <div class="tx-amount tx-neg">-$32.00</div>
          </div>
          <div class="tx-row">
            <div class="tx-icon" style="background:#E3F2FD;"></div>
            <div class="tx-name">Salary</div>
            <div class="tx-amount tx-pos">+$2,400</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
